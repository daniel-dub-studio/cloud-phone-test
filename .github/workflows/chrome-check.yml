name: chrome-check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "NO KVM DEVICE"
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          curl -s ifconfig.me; echo
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot emulator and open muse.ai
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 5
            adb exec-out screencap -p > /tmp/screen.png
            adb shell am start -a android.intent.action.VIEW -d https://muse.ai
            sleep 12
            adb shell input tap 540 2114
            sleep 5
            adb shell uiautomator dump /sdcard/window_dump.xml || true
            adb pull /sdcard/window_dump.xml /tmp/dump.xml || true
            sed 's/></>\n</g' /tmp/dump.xml > /tmp/dump-lines.xml || true
            grep -i "No thanks" /tmp/dump-lines.xml || true
            L=$(grep -i "No thanks" /tmp/dump-lines.xml | grep -i "clickable=\"true\"" | head -1 || true); if [ -z "$L" ]; then L=$(grep -i "No thanks" /tmp/dump-lines.xml | head -1 || true); fi; B=$(echo "$L" | sed -n 's/.*bounds="\(\[[0-9]*,[0-9]*\]\[[0-9]*,[0-9]*\]\)".*/\1/p'); if [ -n "$B" ]; then C=$(echo "$B" | sed 's/\]\[/,/g; s/\[//g; s/\]//g'); X=$(echo "$C" | awk -F, '{print int(($1+$3)/2)}'); Y=$(echo "$C" | awk -F, '{print int(($2+$4)/2)}'); echo "TAP No thanks -> ($X,$Y) bounds=$B"; adb shell input tap "$X" "$Y" || true; else echo "TAP No thanks NOT FOUND"; fi
            sleep 5
            adb exec-out screencap -p > /tmp/after-tap.png
            adb shell am start -a android.intent.action.VIEW -d https://muse.ai
            sleep 20
            adb exec-out screencap -p > /tmp/muse-ai.png
            adb shell dumpsys window windows | grep -i mCurrentFocus || true
            ls -la /tmp/screen.png /tmp/after-tap.png /tmp/muse-ai.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: chrome-check
          path: |
            /tmp/screen.png
            /tmp/after-tap.png
            /tmp/muse-ai.png

name: cloud-phone-test
on:
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "NO KVM DEVICE"
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          curl -s ifconfig.me; echo
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis_playstore
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 5
            adb exec-out screencap -p > /tmp/screen.png
            echo "--- downloading ElevenLabs APK ---"
            curl -L -o /tmp/base.apk "https://github.com/daniel-dub-studio/cloud-phone-test/releases/download/v1.2/elevenlabs-1.4.1-base.apk"
            curl -L -o /tmp/x86_64.apk "https://github.com/daniel-dub-studio/cloud-phone-test/releases/download/v1.2/elevenlabs-1.4.1-x86_64.apk"
            ls -la /tmp/base.apk /tmp/x86_64.apk
            file /tmp/base.apk /tmp/x86_64.apk || true
            echo "--- installing ---"
            adb install-multiple -r -g /tmp/base.apk /tmp/x86_64.apk || echo INSTALL_FAILED
            adb shell pm list packages | grep io.elevenlabs.coreapp || echo NOT_INSTALLED
            echo "--- launching ---"
            adb shell monkey -p io.elevenlabs.coreapp -c android.intent.category.LAUNCHER 1 || echo LAUNCH_FAILED
            sleep 30
            adb exec-out screencap -p > /tmp/muse-open.png
            adb shell pidof io.elevenlabs.coreapp || echo APP_NOT_RUNNING
            echo "--- logcat elevenlabs/crash ---"
            adb logcat -d | grep -iE "io.elevenlabs.coreapp|AndroidRuntime|FATAL" | tail -40 || true
            adb exec-out screencap -p > /tmp/muse-open2.png
            ls -la /tmp/screen.png /tmp/muse-open.png /tmp/muse-open2.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screen
          path: |
            /tmp/screen.png
            /tmp/muse-open.png
            /tmp/muse-open2.png

name: cloud-phone-test
on:
  workflow_dispatch:
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check KVM
        run: |
          ls -l /dev/kvm || echo "NO KVM DEVICE"
          grep -c -E 'vmx|svm' /proc/cpuinfo || true
          curl -s ifconfig.me; echo
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Boot emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            adb shell getprop sys.boot_completed
            adb shell input keyevent 82
            sleep 5
            adb exec-out screencap -p > /tmp/screen.png
            echo "--- downloading Muse APK ---"
            curl -L -A "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/120.0 Safari/537.36" -o /tmp/muse.apk "https://apkpure.net/muse-from-meta/com.facebook.aura/download"
            ls -la /tmp/muse.apk
            file /tmp/muse.apk || true
            echo "--- installing ---"
            adb install -r -g /tmp/muse.apk || echo INSTALL_FAILED
            adb shell pm list packages | grep aura || echo NOT_INSTALLED
            echo "--- launching ---"
            adb shell monkey -p com.facebook.aura -c android.intent.category.LAUNCHER 1 || echo LAUNCH_FAILED
            sleep 10
            adb exec-out screencap -p > /tmp/muse-open.png
            ls -la /tmp/screen.png /tmp/muse-open.png
      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screen
          path: |
            /tmp/screen.png
            /tmp/muse-open.png
